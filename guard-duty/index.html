<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="description" content="閱讀五名獄警的證詞，找出13號移交區的值班者。">
  <title>獄警值班群組</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2306c755'/%3E%3Cpath d='M13 15h38v27H31L20 51v-9h-7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=20261018-cleanup">
</head>
<body>
<main class="phone">
  <header class="chat-top"><h1 id="chatTitle">組長</h1><span id="chatCount" hidden></span><button class="icon-button" id="membersBtn" aria-label="查看群組成員" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></header>
  <div class="messages" id="messages" role="log" aria-label="群組訊息" aria-live="polite" tabindex="0"><div class="day"><span>今天</span></div></div>
  <form class="composer" id="composer" hidden><input id="answerInput" class="answer" autocomplete="off" maxlength="50" placeholder="請稍候……" aria-label="輸入值班者的名字" disabled><button class="send" id="sendBtn" aria-label="送出答案" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 16 8-16 8 3-8-3-8Zm3 8h13"/></svg></button></form>
</main>
<dialog id="membersDialog" aria-labelledby="membersTitle"><div class="dialog-head"><h2 id="membersTitle">群組成員 (7)</h2><button class="icon-button" id="closeMembers" aria-label="關閉">×</button></div><div id="memberList"></div></dialog>
<noscript>請開啟瀏覽器的 JavaScript，才能閱讀訊息並作答。</noscript>
<script src="app.js?v=20261018-reset"></script>
</body>
</html>
